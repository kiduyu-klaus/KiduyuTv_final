import org.jetbrains.compose.desktop.application.dsl.TargetFormat
import java.security.MessageDigest
import java.util.zip.ZipFile

plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.compose'
}

group = 'com.kiduyuk.klausk.kiduyutv'
version = providers.gradleProperty('APP_VERSION').getOrElse(rootProject.file('VERSION').text.trim())

def mpvArchiveName = 'mpv-v0.41.0-dev-g174b638f2-33547610191-x86_64-pc-windows-msvc.zip'
def mpvDownloadUrl = "https://github.com/mpv-player/mpv/releases/download/git-release/${mpvArchiveName}"
def mpvSha256 = 'bb9e9687100f2a014811a64a891afefa412e0bce28baf409d9a087d8c35485e0'
def mpvArchive = layout.buildDirectory.file("downloads/mpv/${mpvArchiveName}")
def appResourcesRoot = layout.buildDirectory.dir('generated/appResources')
def desktopDefaultsDir = layout.buildDirectory.dir('generated/desktopDefaults')

tasks.register('generateDesktopDefaults') {
    group = 'build setup'
    description = 'Generates packaged desktop defaults from CI environment variables.'
    outputs.dir(desktopDefaultsDir)
    outputs.upToDateWhen { false }
    outputs.cacheIf { false }

    doLast {
        File outputFile = desktopDefaultsDir.get().file('kiduyutv-defaults.properties').asFile
        outputFile.parentFile.mkdirs()
        Properties defaults = new Properties()
        defaults.setProperty(
            'streamApiToken',
            System.getenv('KIDUYUTV_STREAM_API_TOKEN') ?: ''
        )
        defaults.setProperty(
            'tmdbBearerToken',
            System.getenv('KIDUYUTV_TMDB_TOKEN') ?: ''
        )
        outputFile.withOutputStream { output ->
            defaults.store(output, 'Generated desktop defaults')
        }
    }
}

tasks.register('prepareBundledMpv') {
    group = 'distribution'
    description = 'Downloads, verifies, and stages the pinned mpv Windows runtime.'
    inputs.property('mpvDownloadUrl', mpvDownloadUrl)
    inputs.property('mpvSha256', mpvSha256)
    outputs.files(
        appResourcesRoot.map { it.file('windows-x64/mpv/mpv.exe') },
        appResourcesRoot.map { it.file('windows-x64/mpv/vulkan-1.dll') }
    )

    doLast {
        File archive = mpvArchive.get().asFile
        archive.parentFile.mkdirs()
        if (!archive.isFile()) {
            logger.lifecycle("Downloading bundled mpv runtime from ${mpvDownloadUrl}")
            new URL(mpvDownloadUrl).withInputStream { input ->
                archive.withOutputStream { output -> output << input }
            }
        }

        MessageDigest digest = MessageDigest.getInstance('SHA-256')
        archive.withInputStream { input ->
            byte[] buffer = new byte[64 * 1024]
            int count
            while ((count = input.read(buffer)) != -1) digest.update(buffer, 0, count)
        }
        String actualSha256 = digest.digest().encodeHex().toString()
        if (!actualSha256.equalsIgnoreCase(mpvSha256)) {
            archive.delete()
            throw new GradleException("Bundled mpv checksum mismatch: expected ${mpvSha256}, got ${actualSha256}")
        }

        File destination = appResourcesRoot.get().dir('windows-x64/mpv').asFile
        destination.mkdirs()
        ZipFile zip = new ZipFile(archive)
        try {
            ['mpv.exe', 'vulkan-1.dll'].each { fileName ->
                def entry = zip.getEntry(fileName)
                if (entry == null) throw new GradleException("${fileName} is missing from ${mpvArchiveName}")
                File target = new File(destination, fileName)
                zip.getInputStream(entry).withCloseable { input ->
                    target.withOutputStream { output -> output << input }
                }
            }
        } finally {
            zip.close()
        }
    }
}

tasks.matching {
    it.name.contains('prepareAppResources') ||
        it.name == 'run' || it.name == 'runDistributable' ||
        it.name == 'createDistributable' || it.name.startsWith('package')
}.configureEach {
    dependsOn(tasks.named('prepareBundledMpv'))
}

// jpackage reads main.wxs from build/compose/tmp/resources immediately before
// invoking WiX. Copy the full JDK 17-compatible template after its preparation
// tasks have completed so the Finish dialog offers a checked Open KiduyuTV action.
def jpackageResourcesDir = layout.buildDirectory.dir('compose/tmp/resources')
def customWixTemplate = file('packaging/main.wxs')
tasks.matching { it.name == 'packageMsi' || it.name == 'packageExe' }.configureEach {
    doFirst {
        File jpackageResources = jpackageResourcesDir.get().asFile
        jpackageResources.mkdirs()
        java.nio.file.Files.copy(
            customWixTemplate.toPath(),
            new File(jpackageResources, 'main.wxs').toPath(),
            java.nio.file.StandardCopyOption.REPLACE_EXISTING
        )
    }
}

kotlin {
    jvmToolchain(17)
}

dependencies {
    implementation compose.desktop.currentOs
    implementation compose.material3
    implementation compose.materialIconsExtended
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-swing:1.8.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'net.java.dev.jna:jna:5.15.0'
    implementation 'net.java.dev.jna:jna-platform:5.15.0'
    implementation 'io.github.kevinnzou:compose-webview-multiplatform-desktop:2.0.3'
    
    // Database
    implementation 'org.xerial:sqlite-jdbc:3.45.0.0'
    
    // Logging
    implementation 'org.slf4j:slf4j-api:2.0.10'
    implementation 'ch.qos.logback:logback-classic:1.4.14'
    
    testImplementation 'junit:junit:4.13.2'
}

sourceSets {
    main {
        resources {
            srcDir 'src/main/resources'
            srcDir desktopDefaultsDir
        }
    }
}

tasks.named('processResources') {
    dependsOn(tasks.named('generateDesktopDefaults'))
    // The CI workflow may create logback.xml while the source set also exposes
    // the same resource through Compose processing.
    duplicatesStrategy = org.gradle.api.file.DuplicatesStrategy.EXCLUDE
    from(rootProject.file('lists')) {
        into 'lists'
    }
}

compose.desktop {
    application {
        mainClass = 'com.kiduyuk.klausk.kiduyutv.desktop.MainKt'
        jvmArgs.addAll([
            '-Xmx1G',
            '-Dfile.encoding=UTF-8',
            '-Dcompose.interop.blending=true',
            '--add-opens=java.desktop/sun.awt=ALL-UNNAMED',
            '--add-opens=java.desktop/java.awt.peer=ALL-UNNAMED',
            "-Dkiduyutv.version=${project.version}".toString()
        ])

        nativeDistributions {
            appResourcesRootDir.set(appResourcesRoot)
            targetFormats(TargetFormat.Exe, TargetFormat.Msi)
            packageName = 'KiduyuTV'
            packageVersion = project.version.toString()
            description = 'KiduyuTV for Windows'
            vendor = 'KiduyuTV'
            modules('java.sql', 'java.net.http', 'java.naming')

            windows {
                iconFile.set(project.file('src/main/resources/kiduyutv.ico'))
                menuGroup = 'KiduyuTV'
                shortcut = true
                dirChooser = true
                perUserInstall = true
                upgradeUuid = '93e54350-c801-4ee5-943c-32498c73bbf6'
            }
        }

        buildTypes.release.proguard {
            obfuscate.set(false)
            configurationFiles.from(project.file('compose-desktop.pro'))
        }
    }
}
